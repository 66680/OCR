name: Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare output directory
        run: mkdir -p out

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install -U pip
          if python -m pip install -e ".[pdf]"; then
            echo "Installed project with [pdf] extra"
          else
            python -m pip install -e .
          fi

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee out/pytest.log

      - name: Schema bump policy (tag mode)
        id: schema_policy
        continue-on-error: true
        env:
          INVSTRUCT_POLICY_MODE: tag
        run: |
          set -o pipefail
          python scripts/check_schema_bump_policy.py 2>&1 | tee out/schema_policy.log

      - name: Contract gates
        id: contract_gates
        continue-on-error: true
        env:
          INVSTRUCT_CI_REPORT: out/release_gate_report.json
        run: |
          set -o pipefail
          python scripts/ci_contract_gates.py 2>&1 | tee out/contract_gates.log

      - name: Release gate summary
        if: always()
        run: |
          CONTRACT_INFO="$(python -m invstruct.cli contract show)"
          {
            echo "## Release Gate Summary";
            echo "";
            echo "- Ref: $GITHUB_REF";
            echo "- Pytest: ${{ steps.pytest.outcome }}";
            echo "- Schema bump policy: ${{ steps.schema_policy.outcome }}";
            echo "- Contract gates: ${{ steps.contract_gates.outcome }}";
            echo "";
            echo "### Contract versions";
            echo '```json';
            echo "$CONTRACT_INFO";
            echo '```';
            if [ "${{ steps.contract_gates.outcome }}" != "success" ]; then
              echo "";
              echo "### Local reproduce commands";
              echo "- \`python scripts/ci_contract_gates.py\`";
              echo "- \`INVSTRUCT_POLICY_MODE=tag python scripts/check_schema_bump_policy.py\`";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: |
            out/release_gate_report.json
            out/pytest.log
            out/schema_policy.log
            out/contract_gates.log
          if-no-files-found: warn

      - name: Enforce release gate
        if: always()
        run: |
          if [ "${{ steps.pytest.outcome }}" != "success" ] || [ "${{ steps.schema_policy.outcome }}" != "success" ] || [ "${{ steps.contract_gates.outcome }}" != "success" ]; then
            echo "Release gate failed."
            exit 1
          fi
