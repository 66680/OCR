[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invstruct"
version = "0.1.0"
description = "Invoice structurer with stable CLI/API contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.0",
  "python-multipart>=0.0.9",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11.0"]
dev = [
  "httpx>=0.27.0",
]

[project.scripts]
invstruct = "invstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
